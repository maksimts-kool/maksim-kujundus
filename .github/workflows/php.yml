name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer
        coverage: xdebug

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Allow Composer plugins
      run: composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHP Lint
      run: composer run-script lint:php

    - name: Run automatic fixes with phpcbf
      run: vendor/bin/phpcbf --standard=WordPress-Core --exclude=WordPress.Files.FileName --ignore=vendor,node_modules,languages .
      continue-on-error: true

    - name: Run WordPress Theme Code Standards (Report Only)
      run: composer run-script lint:wpcs
      continue-on-error: true

    - name: Verify required WordPress theme files
      run: |
        required_files=("style.css" "functions.php" "index.php")
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "✗ Missing required file: $file"
            exit 1
          fi
          echo "✓ Found $file"
        done

    - name: Check for proper theme header
      run: |
        if grep -q "Theme Name:" style.css; then
          echo "✓ Theme Name header found"
        else
          echo "✗ Missing Theme Name in style.css"
          exit 1
        fi
